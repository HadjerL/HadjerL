<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Hadjer Laissaoui - AI and Full-Stack Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#185080"/>
      <stop offset="1" stop-color="#0A9BB8"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="240" rx="14"/></clipPath>
  </defs>
  <style>
    .fade { opacity: 0; animation: fadeIn 1.2s ease-out forwards; }
    .d2 { animation-delay: .5s; }
    .d3 { animation-delay: .9s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .w1 { animation: slide 9s linear infinite; }
    .w2 { animation: slide 14s linear infinite reverse; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-400px); } }
    .dot { animation: float 6s ease-in-out infinite; }
    .dot2 { animation-delay: -2s; }
    .dot3 { animation-delay: -4s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <circle class="dot" cx="120" cy="60" r="38" fill="#fff" opacity=".10"/>
    <circle class="dot dot2" cx="1060" cy="70" r="55" fill="#fff" opacity=".08"/>
    <circle class="dot dot3" cx="930" cy="170" r="22" fill="#fff" opacity=".12"/>
    <g class="w2" opacity=".18">
      <path fill="#fff" d="M0,190 q100,-36 200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 V240 H0 Z"/>
    </g>
    <g class="w1" opacity=".30">
      <path fill="#fff" d="M0,208 q100,-30 200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 V240 H0 Z"/>
    </g>
    <text class="fade" x="600" y="104" text-anchor="middle" fill="#fff" font-size="56" font-weight="700" letter-spacing="1">Hadjer Laissaoui</text>
    <text class="fade d2" x="600" y="146" text-anchor="middle" fill="#fff" font-size="24" font-weight="500">AI &amp; Full-Stack Engineer</text>
    <text class="fade d3" x="600" y="178" text-anchor="middle" fill="#fff" fill-opacity=".9" font-size="16" letter-spacing="2">REACT  ·  SPRING BOOT  ·  PYTHON  ·  DEEP LEARNING</text>
  </g>
</svg>
